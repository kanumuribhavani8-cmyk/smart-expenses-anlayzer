<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense Dashboard</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h1>Expense Dashboard</h1>
        <form id="expense-form">
          <label>Expense Name</label>
          <input type="text" id="name" placeholder="e.g. Groceries" required />

          <label>Category</label>
          <input type="text" id="category" placeholder="e.g. Food" required />

          <label>Amount</label>
          <input type="number" id="amount" step="0.01" min="0" placeholder="0.00" required />

          <button type="submit">Add Expense</button>
        </form>
      </aside>

      <main class="main-panel">
        <div class="summary-cards">
          <div class="card">
            <span>Total</span>
            <strong id="total-amount">₹0.00</strong>
          </div>
          <div class="card">
            <span>Highest Category</span>
            <strong id="top-category">-</strong>
          </div>
          <div class="card">
            <span>Expense Count</span>
            <strong id="expense-count">0</strong>
          </div>
        </div>

        <section class="panel chart-panel">
          <h2>Category Summary</h2>
          <div class="chart-wrapper">
            <canvas id="expense-chart" width="300" height="300"></canvas>
            <div id="category-summary" class="category-summary"></div>
          </div>
        </section>

        <section class="panel">
          <h2>Recent Expenses</h2>
          <table>
            <thead>
              <tr>
                <th>Name</th>
                <th>Category</th>
                <th>Amount</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="expense-table-body"></tbody>
          </table>
        </section>
      </main>
    </div>

    <script src="script.js"></script>
  </body>
</html>
